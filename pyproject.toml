[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlake"
dynamic = ["version"]
description = "A local context layer for AI tools: mirror your repositories, index them into a knowledge graph, and serve it over MCP so agents answer from real source instead of guessing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sayak Sarkar", email = "sayak.bugsmith@gmail.com" }]
keywords = ["context", "knowledge-graph", "mcp", "ai", "code-search",
            "gitlab", "git", "mirror", "cli", "glab", "workspace",
            "offline-first", "semantic-search", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
# Runtime depends on the Python standard library, the external `git`/`glab`
# command-line tools (not pip-installable), and one deliberate exception:
# argcomplete, so shell tab-completion works the moment contextlake itself is
# installed, with no separate extra to remember. It's pure Python, ~40KB, and
# has zero required dependencies of its own -- see docs/usage.md#shell-completion
# for the one-line-per-shell registration step `contextlake init` also offers
# to do for you.
dependencies = ["argcomplete>=3.0"]

[project.urls]
Homepage = "https://sayak.in/contextlake"
Documentation = "https://sayak.in/contextlake/docs.html"
Repository = "https://github.com/sayak-sarkar/contextlake"
Issues = "https://github.com/sayak-sarkar/contextlake/issues"
Changelog = "https://github.com/sayak-sarkar/contextlake/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "hypothesis>=6.0", "pytest-timeout>=2.1",
       "pytest-xdist>=3.0", "pre-commit>=3.0"]
# Tools for cutting a release (build the dist, validate + upload to PyPI).
# See docs/releasing.md.
release = ["build>=1.0", "twine>=5.0"]
# Optional knowledge-layer subsystem (contextlake.kb). Note: `mcp` requires
# Python >= 3.10, so this extra's floor is 3.10 while the core tool stays 3.9+.
kb = [
    # >=2.0: audited and patched for the breaking rename/reshuffle in this major
    # (streamablehttp_client -> streamable_http_client in BOTH mcp_client.py and
    # sources/mcp.py; CallToolResult.structuredContent/isError -> snake_case;
    # server.py's FastMCP -> MCPServer, with host/port/stateless_http/
    # json_response moved from the constructor to .run(); mcp.shared.memory's
    # in-memory test session helper removed, replaced with mcp.Client). Also
    # surfaced a real bug this version's tool dispatch exposes: MCPServer runs
    # every sync tool call via anyio.to_thread.run_sync (unconditional, no
    # opt-out), so a server-lifetime SqliteStore/VectorStore/SqliteVecStore
    # needs one sqlite3 connection per thread, not one connection total --
    # fixed in store/sqlite_store.py and embeddings/store.py.
    "mcp>=2.0", "pydantic>=2", "tomli; python_version<'3.11'", "tomlkit>=0.13",
    # Code parsing: the tree-sitter runtime plus per-language grammar packages
    # (added incrementally as languages are supported).
    "tree-sitter>=0.25", "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23",
    "tree-sitter-c-sharp>=0.23", "tree-sitter-go>=0.23", "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23", "tree-sitter-cpp>=0.23", "tree-sitter-rust>=0.23",
    "tree-sitter-ruby>=0.23", "tree-sitter-php>=0.23", "tree-sitter-scala>=0.23",
    "tree-sitter-hcl>=1.2", "tree-sitter-kotlin>=1.1",
]
# Optional ANN backend for the semantic tier. Without it the vector store falls
# back to an exact pure-Python cosine scan (no native dependency required).
kb-vec = ["sqlite-vec>=0.1"]
# Optional built-in, CPU-only EMBEDDER so the semantic tier works with no Ollama
# and no API key. Static model2vec embeddings (~30MB, auto-downloaded on first
# use); numpy inference, no onnxruntime. See docs/knowledge-layer.md.
kb-local = ["model2vec>=0.3", "huggingface_hub>=0.20"]
# Optional higher-quality built-in embedder engine (ONNX bge-small via fastembed,
# ~90MB). Heavier than kb-local; selected with `engine = "fastembed"`.
kb-fastembed = ["fastembed>=0.3"]
# One-step "everything for local semantic search" convenience extra: the knowledge
# layer + the built-in CPU embedder + the sqlite-vec ANN backend. Install this when
# you want index -> embed -> semantic search to just work, with no Ollama or API key.
kb-full = ["contextlake[kb]", "contextlake[kb-local]", "contextlake[kb-vec]"]
# Optional built-in, CPU-only generative LLM for the wiki tier (no Ollama / API
# key). Small auto-downloaded GGUF via llama-cpp-python. Heavier + slow on CPU;
# off by default. See docs/knowledge-layer.md.
llm-local = ["llama-cpp-python>=0.2", "huggingface_hub>=0.20"]

[project.scripts]
contextlake = "contextlake.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

# Single source of truth for the version: src/contextlake/__init__.py's
# __version__. setuptools statically parses that literal, so pyproject, the
# CLI --version, and the MCP serverInfo can never drift apart again.
[tool.setuptools.dynamic]
version = { attr = "contextlake.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Vendored cytoscape.js + the extracted app.css/app.js for the offline
# `contextlake graph` HTML. Without this the wheel silently omits them.
"contextlake.kb" = ["static/*.js", "static/*.css"]
# Dashboard SPA shell + assets (html/js/css) for `contextlake dashboard`, plus the
# bundled demo-fleet fixture behind `--sample` (must reach pip/wheel installs).
"contextlake.kb.dashboard" = ["static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: noticeably slower than the suite median (wiki-page generation, a real MCP-server lifecycle poll loop, etc); deselect with `pytest -m 'not slow'` for a fast inner loop.",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
# site/ is the website build tooling (page generator + one-off SVG/icon asset
# scripts), not part of the shipped package; CI lints only `src tests`.
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# kb/visualize/ inlines large base64 assets (the brand glyph, the empty-state image)
# and the HTML page template directly into the generated graph page so it stays fully
# self-contained and offline; those data-URI/template lines exceed the line length by
# design and can't be wrapped. Split from a single visualize.py 2026-07-27, see
# plan-kb-module-split.md.
"src/contextlake/kb/visualize/*.py" = ["E501"]
