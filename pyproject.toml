[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlake"
dynamic = ["version"]
description = "A local context layer for AI tools: mirror your repositories, index them into a knowledge graph, and serve it over MCP so agents answer from real source instead of guessing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sayak Sarkar", email = "sayak.bugsmith@gmail.com" }]
keywords = ["context", "knowledge-graph", "mcp", "ai", "code-search",
            "gitlab", "git", "mirror", "cli", "glab", "workspace",
            "offline-first", "semantic-search", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
# Runtime depends on the Python standard library, the external `git`/`glab`
# command-line tools (not pip-installable), and one deliberate exception:
# argcomplete, so shell tab-completion works the moment contextlake itself is
# installed, with no separate extra to remember. It's pure Python, ~40KB, and
# has zero required dependencies of its own -- see docs/cli-reference.md#shell-completion
# for the one-line-per-shell registration step `contextlake init` also offers
# to do for you.
dependencies = ["argcomplete>=3.0"]

[project.urls]
Homepage = "https://sayak.in/contextlake"
Documentation = "https://sayak.in/contextlake/docs.html"
Repository = "https://github.com/sayak-sarkar/contextlake"
Issues = "https://github.com/sayak-sarkar/contextlake/issues"
Changelog = "https://github.com/sayak-sarkar/contextlake/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ruff carries an upper bound and the others do not, because the lint is a *gate*: a
# minor ruff release that adds a rule to a selected group turns CI red with nobody having
# changed a line, and `S` (flake8-bandit) is a large group that grows. The bound makes
# that arrive as a Dependabot PR to look at instead of a red build on unrelated work.
# When raising it, run `ruff check src tests` on the new version first -- new findings are
# expected and each one needs reading, not a blanket noqa.
# pypdf rides in `dev` as well as in its own `kb-pdf` extra, deliberately: the PDF
# ingest tests skip themselves when it is absent, and a job that skips them is green
# without having exercised the feature at all. The test environment must hold it.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.16,<0.17", "hypothesis>=6.0",
       "pytest-timeout>=2.1", "pytest-xdist>=3.0", "pre-commit>=3.0", "pypdf>=6.15"]
# Tools for cutting a release (build the dist, validate + upload to PyPI).
# See docs/releasing.md.
release = ["build>=1.0", "twine>=5.0"]
# Optional knowledge-layer subsystem (contextlake.kb). The whole tool now has a
# single floor of Python 3.10, so this extra no longer raises it above the core's.
kb = [
    # >=2.0: audited and patched for the breaking rename/reshuffle in this major
    # (streamablehttp_client -> streamable_http_client in BOTH mcp_client.py and
    # sources/mcp.py; CallToolResult.structuredContent/isError -> snake_case;
    # server.py's FastMCP -> MCPServer, with host/port/stateless_http/
    # json_response moved from the constructor to .run(); mcp.shared.memory's
    # in-memory test session helper removed, replaced with mcp.Client). Also
    # surfaced a real bug this version's tool dispatch exposes: MCPServer runs
    # every sync tool call via anyio.to_thread.run_sync (unconditional, no
    # opt-out), so a server-lifetime SqliteStore/VectorStore/SqliteVecStore
    # needs one sqlite3 connection per thread, not one connection total --
    # fixed in store/sqlite_store.py and embeddings/store.py.
    "mcp>=2.0", "pydantic>=2", "tomli; python_version<'3.11'", "tomlkit>=0.13",
    # Code parsing: the tree-sitter runtime plus per-language grammar packages
    # (added incrementally as languages are supported).
    "tree-sitter>=0.25", "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23",
    "tree-sitter-c-sharp>=0.23", "tree-sitter-go>=0.23", "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23", "tree-sitter-cpp>=0.23", "tree-sitter-rust>=0.23",
    "tree-sitter-ruby>=0.23", "tree-sitter-php>=0.23", "tree-sitter-scala>=0.23",
    "tree-sitter-hcl>=1.2", "tree-sitter-kotlin>=1.1",
    # Added together, each verified against a real snippet of its language before the
    # query was written. Floors are the versions checked, not the newest published.
    "tree-sitter-swift>=0.7", "tree-sitter-dart>=0.1", "tree-sitter-zig>=1.1",
    "tree-sitter-perl>=1.2", "tree-sitter-bash>=0.25",
    "tree-sitter-elixir>=0.3",
    # Presentation tier: the names other files refer to, not code symbols.
    "tree-sitter-css>=0.25", "tree-sitter-html>=0.23", "tree-sitter-nix>=0.1",
    # Svelte uses its own grammar; `.vue` borrows HTML's, since no tree-sitter-vue
    # package exists on PyPI at all.
    "tree-sitter-svelte>=1.0",
    # Build tier. A hard dependency because this grammar ships an sdist and a wheel for
    # every platform contextlake installs on, which is the test that decides hard-versus-
    # optional here: a grammar with partial wheel coverage would make `pip install
    # contextlake[kb]` itself fail on the platforms it misses.
    "tree-sitter-make>=1.1",
]
# Optional ANN backend for the semantic tier. Without it the vector store falls
# back to an exact pure-Python cosine scan (no native dependency required).
kb-vec = ["sqlite-vec>=0.1"]
# Optional Dockerfile grammar. Optional for a packaging reason, not a product one:
# tree-sitter-dockerfile publishes two wheels (macOS arm64, Linux x86_64) and no sdist,
# so a hard dependency would make `pip install contextlake[kb]` FAIL on Windows, aarch64
# Linux and musl rather than merely index less there. Without it, Dockerfiles are skipped
# and the run says so by name, with this install command.
kb-dockerfile = ["tree-sitter-dockerfile>=0.2"]
# Optional built-in, CPU-only EMBEDDER so the semantic tier works with no Ollama
# and no API key. Static model2vec embeddings (~30MB, auto-downloaded on first
# use); numpy inference, no onnxruntime. See docs/knowledge-layer.md.
kb-local = ["model2vec>=0.3", "huggingface_hub>=0.20"]
# Optional higher-quality built-in embedder engine (ONNX bge-small via fastembed,
# ~90MB). Heavier than kb-local; selected with `engine = "fastembed"`.
kb-fastembed = ["fastembed>=0.3"]
# One-step "everything for local semantic search" convenience extra: the knowledge
# layer + the built-in CPU embedder + the sqlite-vec ANN backend. Install this when
# you want index -> embed -> semantic search to just work, with no Ollama or API key.
kb-full = ["contextlake[kb]", "contextlake[kb-local]", "contextlake[kb-vec]"]
# Optional PDF reader for the built-in `files` ingest source: design docs, RFCs and
# decision records arrive as PDFs. Pure Python, no OCR engine and no native build --
# it reads a PDF's *text layer* only, so a scanned page is reported as having none
# rather than ingested empty. Deliberately NOT folded into `kb-full`: that bundle
# means "local semantic search works with no Ollama and no API key", not "every
# optional reader ships".
#
# The floor is 5.0 because the suite was RUN against 5.0.0 and passes, not because that
# is the version this was developed on. A floor set to whatever happened to be installed
# excludes users on an older pin for no reason anybody measured; this code touches only
# `PdfReader(path, strict=False)`, `.pages`, `.metadata` and `.extract_text()`, all of
# which long predate it. Lower it further only with another run behind the change.
kb-pdf = ["pypdf>=5.0"]
# Optional built-in, CPU-only generative LLM for the wiki tier (no Ollama / API
# key). Small auto-downloaded int4 model via openvino-genai. Heavier + slow on CPU;
# off by default. See docs/knowledge-layer.md.
#
# An ordinary PyPI wheel with no compiler and no custom index, unlike the GGUF
# backend this replaces, and with wheels for cp310 through cp314 -- which is what
# lets the container base image move to a current Python. Pulls neither torch nor
# transformers: its only requirement is openvino-tokenizers, which requires openvino.
llm-local = ["openvino-genai>=2026.3", "huggingface_hub>=0.20"]

[project.scripts]
contextlake = "contextlake.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

# Single source of truth for the version: src/contextlake/__init__.py's
# __version__. setuptools statically parses that literal, so pyproject, the
# CLI --version, and the MCP serverInfo can never drift apart again.
[tool.setuptools.dynamic]
version = { attr = "contextlake.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Vendored cytoscape.js + the extracted app.css/app.js for the offline
# `contextlake graph` HTML. Without this the wheel silently omits them.
"contextlake.kb" = ["static/*.js", "static/*.css"]
# Dashboard SPA shell + assets (html/js/css) for `contextlake dashboard`, plus the
# bundled demo-fleet fixture behind `--sample` (must reach pip/wheel installs).
"contextlake.kb.dashboard" = ["static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: noticeably slower than the suite median (wiki-page generation, a real MCP-server lifecycle poll loop, etc); deselect with `pytest -m 'not slow'` for a fast inner loop.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# site/ is the website build tooling (page generator + one-off SVG/icon asset
# scripts), not part of the shipped package; CI lints only `src tests`.
extend-exclude = ["site"]

[tool.ruff.lint]
# `S` is flake8-bandit. It used to run as a separate reporting-only pass in
# security.yml over an untriaged backlog, which meant it could never fail and so never
# said anything. The backlog is now triaged to zero: the rules that fire on every call
# this tool must make are ignored below with the reason, and every remaining site was
# read and carries its own `# noqa: S...` with why it is safe. Selecting it here makes
# the normal lint gate -- CI on every push and PR, plus the release build -- refuse a
# NEW finding, which is the property the reporting pass never had.
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# kb/visualize/ inlines large base64 assets (the brand glyph, the empty-state image)
# and the HTML page template directly into the generated graph page so it stays fully
# self-contained and offline; those data-URI/template lines exceed the line length by
# design and can't be wrapped. Split from a single visualize.py 2026-07-27, see
# plan-kb-module-split.md.
"src/contextlake/kb/visualize/*.py" = ["E501"]

# The whole `S` ruleset, in tests only. Nothing here ships, and the findings are what a
# test suite is made of: 4672 of them are S101 ("assert used"), which is pytest's entire
# idiom, and the rest are fixtures doing on purpose what the rules warn about -- fake
# tokens, temp paths, binding a local port, feeding malformed XML to a parser. This is a
# scope statement, not a dismissal: a security bug in a test does not reach a user.
"tests/**" = ["S"]

# Two rules, in the shipped package only, that fire on every call this tool exists to
# make. contextlake drives `git` and `glab` as subprocesses, so S603 flags all of them,
# and it resolves them from PATH rather than by absolute path, which is what S607 flags
# and is the only portable choice -- an absolute path would break macOS, Windows and
# nix, where none of these live in the same place. A new instance of either carries no
# signal, so gating on them would only teach people to add blanket noqa comments.
# Everything else in `S` stays on, per-site, with a written reason.
"src/contextlake/**" = ["S603", "S607"]

# The same two rules for the release-time verifier, for the same reason and no wider: it
# drives `pip`, `git` and a throwaway venv's own interpreter as subprocesses, which is the
# entire job. Its arguments are a version string and a tag the release operator typed, and
# every one is passed as a list element, never through a shell. Scoped to this one file
# rather than to `scripts/**`, so a future script has to make its own case.
"scripts/verify-published-release.py" = ["S603", "S607"]

# The G2 derivation harness drives `git` and `python -m contextlake` as subprocesses --
# that is the whole job, and it is how the harness proves the SHIPPED command produces the
# output rather than testing an internal function. Same scoping rule as above: this one
# file, so a future benchmark has to make its own case.
"benchmarks/g2-derivation/run.py" = ["S603", "S607"]
