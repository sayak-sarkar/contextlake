version: 2

# Automated dependency PRs (RC-P1-2 / F-9): the [kb] extra alone pulls 15+
# tree-sitter grammar packages plus mcp/pydantic, and the optional kb-vec/
# kb-local/kb-fastembed/llm-local extras add native-code deps (sqlite-vec,
# model2vec, onnxruntime, openvino-genai) -- all worth patching
# promptly. Minor/patch bumps are grouped per ecosystem so a routine tree-sitter
# point-release doesn't open a dozen separate PRs; major bumps stay ungrouped
# since they can be breaking and deserve individual review.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The Dockerfile pins its base image by digest for reproducible builds, which
  # means nothing moves it forward on its own: a pinned digest silently ages out
  # of security updates in a way a floating tag never does. This is what turns
  # that pin from a liability back into a deliberate choice.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # The image must not run a Python newer than the ci.yml matrix. The matrix and the
    # pyproject classifiers stop at 3.13, because 3.14 is not tested. Raise this bound in
    # the same change that adds 3.14 to the matrix and the classifiers.
    # Commit a9db3ca9 removed the 3.14 classifier because nothing tests it.
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
