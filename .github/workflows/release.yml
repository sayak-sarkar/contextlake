name: release

# Publish to PyPI via Trusted Publishing (OIDC) when a vX.Y.Z tag is pushed.
# No API token is stored anywhere: the publish job mints a short-lived OIDC
# token that PyPI trusts for this repo + workflow. See docs/releasing.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-ci:
    name: verify ci.yml passed for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check the full Python 3.9-3.13 CI matrix succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci.yml triggers on push-to-main/PR, never on tags, so it cannot gate us
          # via a workflow_run trigger keyed on this tag. Instead, look up whatever
          # ci.yml run already completed for the exact commit this tag points at
          # (tags are cut from a commit already on main) and refuse to release if
          # it's missing or red. This is the fix for the v2.62.0 incident where a
          # red ci.yml run stayed live a full cycle because nothing watched it.
          sha="${{ github.sha }}"
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --commit "$sha" --json conclusion,status \
            --jq '[.[] | select(.status=="completed")][0].conclusion // "missing"')
          echo "ci.yml conclusion for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci.yml has not passed on commit $sha (conclusion: $conclusion) — refusing to release."
            exit 1
          fi

  build:
    name: build & validate
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install (dev + knowledge layer + build tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb]"
          pip install build twine

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Version lives only in src/contextlake/__init__.py (pyproject reads it
          # dynamically via setuptools attr:), so read it from there.
          pkg="$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('src/contextlake/__init__.py').read_text()).group(1))")"
          echo "tag=$tag  package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package version $pkg — bump src/contextlake/__init__.py before tagging"
            exit 1
          fi

      - name: Lint + full test suite, including tests/kb (release gate)
        run: |
          ruff check src tests
          pytest -q

      - name: Build sdist + wheel
        run: |
          rm -rf dist
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/contextlake/
    permissions:
      id-token: write   # required for OIDC / Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: publish image (ghcr.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
      id-token: write   # required for cosign keyless signing (Fulcio/Rekor via OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push (bundles deps + pre-downloaded models)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true   # SLSA build provenance attestation (buildx/BuildKit)
          sbom: true         # SPDX SBOM attestation (buildx/BuildKit)

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the published image (keyless, via this workflow's OIDC identity)
        # No key material anywhere: cosign mints a short-lived cert from Fulcio
        # using the job's GitHub OIDC token (id-token: write above) and logs the
        # signature to the public Rekor transparency log. Signs by digest, not
        # tag, so it's pinned to exactly what was just built regardless of which
        # of the tags above a consumer later pulls.
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # slim variant: same source, no llama-cpp-python / baked GGUF (see
      # Dockerfile's "slim" target) -- a much smaller pull for anyone using an
      # external wiki LLM (Ollama/OpenAI/Anthropic/cli) instead of the built-in
      # one. Published alongside "full" with a "-slim" tag suffix; the
      # provenance/SBOM/cosign treatment mirrors the full image exactly.
      - id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-slim
            type=raw,value=latest-slim
            type=raw,value=slim

      - name: Build & push slim variant (no local-LLM extra, no baked GGUF)
        id: build-slim
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          provenance: true
          sbom: true

      - name: Sign the published slim image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build-slim.outputs.digest }}"

  github-release:
    name: github release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create / update the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull this version's section out of CHANGELOG.md for the release notes.
          awk -v v="$version" 'index($0,"## ["v"]")==1{f=1;next} f&&/^## \[/{exit} f{print}' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "contextlake $version" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "contextlake $version" --notes-file notes.md --verify-tag
          fi
