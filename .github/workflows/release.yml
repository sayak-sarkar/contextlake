name: release

# Publish to PyPI via Trusted Publishing (OIDC) when a vX.Y.Z tag is pushed.
# No API token is stored anywhere: the publish job mints a short-lived OIDC
# token that PyPI trusts for this repo + workflow. See docs/releasing.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-ci:
    name: verify ci.yml passed for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check the full Python 3.10-3.13 CI matrix succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci.yml triggers on push-to-main/PR, never on tags, so it cannot gate us
          # via a workflow_run trigger keyed on this tag. Instead, look up whatever
          # ci.yml run already completed for the exact commit this tag points at
          # (tags are cut from a commit already on main) and refuse to release if
          # it's missing or red. This is the fix for the v2.62.0 incident where a
          # red ci.yml run stayed live a full cycle because nothing watched it.
          sha="${{ github.sha }}"
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --commit "$sha" --json conclusion,status \
            --jq '[.[] | select(.status=="completed")][0].conclusion // "missing"')
          echo "ci.yml conclusion for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci.yml has not passed on commit $sha (conclusion: $conclusion) — refusing to release."
            exit 1
          fi

  build:
    name: build & validate
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install (dev + knowledge layer + build tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb]"
          pip install build twine

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Version lives only in src/contextlake/__init__.py (pyproject reads it
          # dynamically via setuptools attr:), so read it from there.
          pkg="$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('src/contextlake/__init__.py').read_text()).group(1))")"
          echo "tag=$tag  package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package version $pkg — bump src/contextlake/__init__.py before tagging"
            exit 1
          fi

      - name: Lint + full test suite, including tests/kb (release gate)
        run: |
          ruff check src tests
          pytest -q

      - name: Build sdist + wheel
        run: |
          rm -rf dist
          python -m build
          twine check dist/*

      - name: "SBOM: the BUILT WHEEL's dependency closure, from a venv holding nothing else"
        # The trap this step is written to avoid: running an SBOM generator over *this* job's
        # environment. That environment holds ruff, pytest, twine and build, none of which
        # ship, and publishing it as "contextlake's SBOM" would be an artifact that says
        # something untrue. So the subject is a throwaway venv containing the wheel that was
        # just built plus the `kb-full` extras a user is told to install, and nothing else.
        #
        # cyclonedx-bom gets its OWN venv and is never installed into either the subject venv
        # or this job's environment. Two separate reasons, and both matter:
        #   - not into the subject venv, because an SBOM that lists its own generator is
        #     describing the wrong thing;
        #   - not into this job's environment, because that already holds ruff, pytest, twine
        #     and build. Adding a package there lets pip re-resolve a shared transitive
        #     (packageurl-python, license-expression, py-serializable) and quietly change the
        #     environment the LATER steps run in. The canary below only inspects the JSON, so
        #     it would not catch that. This also matches how the step was verified locally: a
        #     dedicated tool venv, not a shared one.
        #
        # Scope, stated because the file cannot state it for itself: `kb-full` is
        # kb + kb-local + kb-vec. It does NOT include `kb-fastembed`, and it does NOT include
        # `llm-local`, which compiles from source off a separate wheel index; the ghcr images
        # and the release binaries do carry llm-local, and `pip-audit-resolved` in
        # security.yml is what covers that set.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p sbom
          # the generator, in its own venv
          python -m venv /tmp/sbomtool
          /tmp/sbomtool/bin/python -m pip install --quiet --upgrade pip
          /tmp/sbomtool/bin/python -m pip install --quiet cyclonedx-bom
          # the subject: the built wheel plus the extras a user is told to install, alone
          python -m venv /tmp/shipped
          /tmp/shipped/bin/python -m pip install --quiet --upgrade pip
          /tmp/shipped/bin/python -m pip install --quiet "$(ls dist/*.whl)[kb-full]"
          /tmp/sbomtool/bin/cyclonedx-py environment /tmp/shipped/bin/python \
            --pyproject pyproject.toml --mc-type library \
            --of JSON -o "sbom/contextlake-${version}.cdx.json"
          # The root component's version comes out null: cyclonedx-py reads it from
          # pyproject, and this project declares `dynamic = ["version"]`, so there is nothing
          # there to read. There is no flag for it (--sv is the *spec* version). The tag is
          # authoritative here because the step above already refused to proceed unless the
          # tag matches the packaged version.
          python - "sbom/contextlake-${version}.cdx.json" "$version" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path) as fh:
              bom = json.load(fh)
          comp = bom["metadata"]["component"]
          comp["version"] = version
          comp["purl"] = f"pkg:pypi/contextlake@{version}"
          with open(path, "w") as fh:
              json.dump(bom, fh, indent=2)
          PY

      - name: "Canary: the SBOM must describe what ships, and nothing else"
        # Same reasoning as the pip-audit-resolved canary: the failure mode of a generated
        # document is silent and plausible. Assert the shape before publishing it, so this
        # cannot quietly become an SBOM of the build machine.
        run: |
          python - "sbom/contextlake-${GITHUB_REF_NAME#v}.cdx.json" "${GITHUB_REF_NAME#v}" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path) as fh:
              bom = json.load(fh)
          root = bom["metadata"]["component"]
          names = {c["name"].lower() for c in bom.get("components", [])}
          problems = []
          if root.get("name") != "contextlake" or root.get("version") != version:
              problems.append(f"root component is {root.get('name')}@{root.get('version')}, "
                              f"expected contextlake@{version}")
          # Anything here means the generator described the build environment, not the wheel.
          leaked = names & {"ruff", "pytest", "pytest-cov", "twine", "build", "hypothesis",
                            "pre-commit", "cyclonedx-bom", "cyclonedx-python-lib"}
          if leaked:
              problems.append(f"build-only packages present: {sorted(leaked)}")
          # A plausible-looking but nearly empty SBOM is the other silent failure.
          if len(names) < 30:
              problems.append(f"only {len(names)} components; the kb-full closure is far larger")
          for want in ("mcp", "pydantic", "tree-sitter"):
              if want not in names:
                  problems.append(f"{want} missing, so this is not the shipped closure")
          if problems:
              for p in problems:
                  print(f"::error::SBOM canary: {p}")
              sys.exit(1)
          print(f"canary ok: contextlake@{version}, {len(names)} components, no build tooling")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

      # A SEPARATE artifact, deliberately: the `dist` artifact is what the publish job hands
      # to PyPI, and a stray .json in that directory is not a distribution. It rejoins the
      # release in the github-release job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/contextlake/
    permissions:
      id-token: write   # required for OIDC / Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        # This was `@release/v1`, which upstream recommends precisely because it is a
        # BRANCH: their fixes then arrive without anyone here bumping anything. We pin
        # anyway, because this is the one step in the repository holding an OIDC token
        # that can publish to PyPI under our name, and a mutable ref on that step is the
        # highest-value thing here to make immutable. Verified rather than assumed at pin
        # time: `release/v1`'s head was exactly v1.14.2, so this is the same code the
        # branch was serving. Dependabot owns the bump, so the trade is a bump PR to
        # review, not a fix we never receive.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # A re-run of this workflow, or a version already uploaded by hand,
          # otherwise fails the whole job on "file already exists" -- which
          # used to take the GitHub Release down with it (see github-release's
          # `if` below). Publishing is meant to be idempotent.
          skip-existing: true

  docker:
    name: publish image (ghcr.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
      id-token: write   # required for cosign keyless signing (Fulcio/Rekor via OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push (bundles deps + pre-downloaded models)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true   # SLSA build provenance attestation (buildx/BuildKit)
          sbom: true         # SPDX SBOM attestation (buildx/BuildKit)

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the published image (keyless, via this workflow's OIDC identity)
        # No key material anywhere: cosign mints a short-lived cert from Fulcio
        # using the job's GitHub OIDC token (id-token: write above) and logs the
        # signature to the public Rekor transparency log. Signs by digest, not
        # tag, so it's pinned to exactly what was just built regardless of which
        # of the tags above a consumer later pulls.
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # slim variant: same source, no openvino-genai / baked model (see
      # Dockerfile's "slim" target) -- a much smaller pull for anyone using an
      # external wiki LLM (Ollama/OpenAI/Anthropic/cli) instead of the built-in
      # one. Published alongside "full" with a "-slim" tag suffix; the
      # provenance/SBOM/cosign treatment mirrors the full image exactly.
      - id: meta-slim
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=false` is load-bearing, not tidiness. metadata-action
          # defaults to flavor `latest=auto`, which adds a bare `latest` tag
          # whenever it sees a semver tag -- so this step silently claimed
          # `latest` too, and because slim is pushed after full it *won*.
          # Observed on the 5.0.0 release: the full image ended up tagged only
          # `5.0.0` while `latest` resolved to slim, so a plain
          # `docker pull ghcr.io/<repo>` handed people an image with no
          # local-LLM extra and no baked model. `latest` belongs to full.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-slim
            type=raw,value=latest-slim
            type=raw,value=slim

      - name: Build & push slim variant (no local-LLM extra, no baked GGUF)
        id: build-slim
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: slim
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          provenance: true
          sbom: true

      - name: Sign the published slim image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build-slim.outputs.digest }}"

  github-release:
    name: github release
    needs: [build, publish]
    # Runs as long as the artifacts exist, even if PyPI publishing failed.
    # On the 4.0.0 tag `publish` failed on a duplicate file, this job was
    # skipped as a consequence, and the wheel and sdist had to be attached to
    # the release by hand. The GitHub Release has value independently of
    # whether PyPI accepted the upload, and a transient index outage should
    # not decide whether a release exists.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create / update the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Create GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull this version's section out of CHANGELOG.md for the release notes.
          awk -v v="$version" 'index($0,"## ["v"]")==1{f=1;next} f&&/^## \[/{exit} f{print}' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "contextlake $version" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* sbom/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* sbom/* \
              --title "contextlake $version" --notes-file notes.md --verify-tag
          fi
