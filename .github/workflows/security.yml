name: security

# Supply-chain scanning (RC-P1-2 / F-9): two dependency-vulnerability audits and CodeQL
# static analysis over both languages this repo ships. Runs on every PR plus a weekly
# schedule so newly-disclosed CVEs surface even against an untouched main. Deliberately
# its own workflow, separate from ci.yml's version-matrix gate: what belongs here is
# scanning that reports against the outside world, not a new blocking dependency for
# core CI.
#
# The security-focused lint pass that used to live here does not any more -- `ruff
# --select S` is part of the ordinary blocking lint now. See the note where that job was.
#
# Every `uses:` is pinned to a commit SHA with the version in a trailing comment. A tag
# is a mutable pointer, so `@v5` means "whatever that owner points it at today", and
# these jobs hold a checkout, a registry login and the OIDC token that publishes to PyPI.
# Dependabot's github-actions ecosystem rewrites both the SHA and the comment, so the
# pins do not rot -- do not "simplify" them back to tags.

on:
  # `push` on main is the load-bearing trigger here, not `pull_request`: this
  # repo lands work directly on main (fast-forward, no merge commits), so a
  # PR-only scan would sit idle for weeks and first report on the Monday cron.
  # `pull_request` stays for Dependabot's bump PRs, which is where a scan
  # result is most actionable.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: "Install (widest dependency surface: dev + release + every kb extra)"
        # `llm-local` (openvino-genai) is excluded HERE only to keep this job's
        # install small; it is an ordinary wheel now and no longer a toolchain
        # flakiness risk. The resolve-and-audit job below covers it either way --
        # the compensating control this comment used to name ("it's still
        # covered by Dependabot version tracking") does NOT: the one real CVE in
        # the tree is a *transitive* dependency of that extra, and Dependabot
        # reads pyproject.toml's declared deps with no lockfile, so it never sees
        # a grandchild. The `pip-audit-resolved` job below covers the extra
        # without building it. Do not "fix" this by adding llm-local here.
        #
        # `release` (twine -> keyring -> SecretStorage -> cryptography) IS now
        # included: it compiles nothing, so the flakiness argument never applied
        # to it, and while it was absent a CVE in that subtree was invisible for
        # the same structural reason.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,release,kb,kb-vec,kb-local,kb-fastembed]"
      - name: pip-audit
        # No `inputs:` given -- deps live in pyproject.toml extras, not a
        # requirements.txt. Confirmed (reading pypa/gh-action-pip-audit's
        # setup/venv.bash and action.py at this pinned tag) that with no
        # `virtual-environment:` input the action installs pip-audit into
        # whatever Python is already active -- i.e. the same interpreter the
        # step above just installed our deps into -- and with empty `inputs`,
        # pip-audit runs in environment-audit mode against that interpreter's
        # installed packages. So this does audit the kb dependency surface
        # installed above, not an empty action-local venv.
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0

  pip-audit-resolved:
    name: pip-audit (resolved set, includes llm-local)
    runs-on: ubuntu-latest
    # Audits the dependency set contextlake actually SHIPS, including the
    # `llm-local` extra that the environment-audit job above cannot install
    # without a CMake toolchain.
    #
    # Why this job exists at all: `llm-local` is what `Dockerfile`'s build-full
    # stage installs (so it is in `ghcr.io/...:latest`) and what `binaries.yml`
    # builds into the release executables (PYAPP_PROJECT_FEATURES). It was
    # audited by nothing: excluded from the job above by design, and invisible to
    # Dependabot, which resolves declared dependencies from pyproject.toml with no
    # lockfile and so never sees a transitive grandchild. Both controls reported
    # clean and both were correct about the narrower thing they were pointed at.
    #
    # It resolves rather than installs: `pip install --dry-run --report` performs
    # the full dependency resolution and writes the resulting set as JSON without
    # downloading or building anything, so the flakiness that justified excluding
    # the extra above does not apply. Every extra now resolves to ordinary PyPI
    # wheels, so no index or --only-binary pin is needed to keep a compiler out.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Resolve the shipped dependency set (no build, no install)
        run: |
          pip install --dry-run --ignore-installed --quiet --report resolved.json \
            '.[kb,kb-vec,kb-local,kb-fastembed,llm-local,release]'
          jq -r '.install[] | "\(.metadata.name)==\(.metadata.version)"' resolved.json \
            | grep -viE '^contextlake==' | sort > resolved.txt
          echo "resolved $(wc -l < resolved.txt) packages"
          cat resolved.txt
      - name: "Canary: the audit must actually cover the extras this job exists for"
        # Without this, the failure mode is silent and green: if resolution ever
        # produces an empty or partial set (a changed pip flag, a dead index, a
        # renamed extra), pip-audit happily reports "no known vulnerabilities" for
        # a set of nothing -- which is precisely the blind-scanner defect this job
        # was added to remove. So assert coverage before trusting the result.
        #
        # The markers are the extras' own declared packages, NOT the advisory this
        # job first surfaced: canarying on a finding would conflate "can we see
        # this subtree" with "does this subtree currently have a CVE", and would
        # turn the job red the day the finding is legitimately resolved.
        run: |
          for pkg in openvino_genai twine numpy huggingface_hub; do
            grep -qiE "^${pkg//_/[-_]}==" resolved.txt \
              || { echo "::error::$pkg missing from the resolved set -- this audit is not covering what it claims to. Refusing to report clean."; exit 1; }
          done
          echo "canary ok: llm-local, release and kb extras are all represented"
      - name: pip-audit (resolved set)
        # No suppressions. PYSEC-2026-2447 / GHSA-w8v5-vhqr-4h9v / CVE-2025-69872
        # (diskcache 5.6.3) was carried here as "known-unresolved, disposition
        # pending" because no fixed upstream version existed, so the job could not
        # be made green by upgrading. The disposition taken in 7.0.0 was to REMOVE
        # the dependency: diskcache was reached only through
        # llm-local -> llama-cpp-python, and that backend was replaced by
        # openvino-genai, whose closure does not contain it. Verified by resolving
        # the extra in a clean environment, not by reading the advisory.
        #
        # So this job now has no ignore list at all, and a red result means a real
        # new advisory rather than a suppression that expired. See SECURITY.md.
        run: |
          pip-audit --no-deps -r resolved.txt --progress-spinner off

  # There is deliberately no security-lint job here any more.
  #
  # `ruff --select S` (flake8-bandit) used to run as its own reporting-only pass, with
  # `continue-on-error: true`, over an untriaged backlog of 4893 findings. A job that
  # cannot fail says nothing, and one carrying that much noise was never going to be
  # read: 4672 of those were S101 ("assert used") in tests/, which is pytest's entire
  # idiom.
  #
  # The backlog is now triaged to zero and `S` is in pyproject.toml's
  # [tool.ruff.lint] select, so it runs inside `ruff check src tests` -- which is
  # already a *blocking* step in ci.yml on every push and PR, and again in release.yml's
  # build gate. That is strictly stronger than this job ever was, and it also means a
  # contributor's local `ruff check` sees the same rules CI does.
  #
  # Do not "restore" this job: it would re-report every finding the main gate already
  # enforces, and its green tick would mean nothing.

  codeql:
    # JavaScript is not optional cover here. The stored-XSS fixed in 6.2.0 lived in the
    # generated graph page, which is JavaScript, and a Python-only scan could not have
    # seen it however long it ran. The dashboard, the graph viewer and the command
    # palette are all first-party JavaScript this repository ships.
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false        # one language's failure must not hide the other's findings
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # Excludes the vendored bundles and the generated copies of our own files.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
