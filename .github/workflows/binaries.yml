name: binaries

# Build single-file executables (via PyApp: a Rust launcher that bootstraps a
# real Python + contextlake[kb-full] on first run, no separate Python install
# needed) and attach them to the GitHub Release for the same tag.
#
# Deliberately a SEPARATE workflow from release.yml: PyPI publish is the primary,
# load-bearing release path, so a binary-build failure here must never block it.
# uvx / `uv tool install contextlake[kb-full]` remains the recommended install
# for anyone who already has uv; these binaries only exist for the have-nothing-
# installed audience.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-ci:
    name: verify ci.yml passed for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check the full Python 3.10-3.13 CI matrix succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same gate as release.yml: ci.yml never runs on tags itself, so check
          # whatever ci.yml run already completed for the commit this tag points at.
          sha="${{ github.sha }}"
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --commit "$sha" --json conclusion,status \
            --jq '[.[] | select(.status=="completed")][0].conclusion // "missing"')
          echo "ci.yml conclusion for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci.yml has not passed on commit $sha (conclusion: $conclusion) — refusing to build binaries."
            exit 1
          fi

  build:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: contextlake-linux-x86_64
          - os: macos-latest
            asset_name: contextlake-macos-arm64
          - os: windows-latest
            asset_name: contextlake-windows-x86_64.exe
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The comment says "stable @ <date>", not a version, because there is no version to
      # name: `stable` is a BRANCH the author force-updates, so the SHA is simply where it
      # pointed on that date. And the pin fixes the *selector action*, not the compiler --
      # the toolchain it installs is still whatever upstream Rust calls stable on the day
      # this job runs. Pinning it makes the step that runs on our runner immutable, which
      # is the whole point; it is not a claim that the build is now reproducible.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable @ 2026-08-08

      - name: Build the launcher (embeds contextlake[kb-full] metadata; installs at first run)
        shell: bash
        env:
          PYAPP_PROJECT_NAME: contextlake
          PYAPP_PROJECT_VERSION: ${{ github.ref_name }}
          # llm-local rides along so the standalone binary needs nothing else to
          # generate a wiki offline. It is the "I don't want to think about Python
          # packaging" distribution channel, so it should be the one that asks the
          # least of the user.
          PYAPP_PROJECT_FEATURES: kb-full,llm-local
          # PyPI namespace cannot hold cpu/cu121/cu124/metal builds of the same
          # version. Upstream therefore ships a separate index per accelerator, the
          # same convention PyTorch uses. Without this the binary's first run tries
          # to compile C++ on a machine chosen precisely because it has no toolchain.
          #
          # --only-binary is scoped to that one package rather than :all: on purpose:
          # :all: would also forbid a source fallback for every kb-full dependency,
          # so a single missing wheel on any platform would break the binary outright.
          PYAPP_EXEC_SPEC: "contextlake.cli:main"
        run: |
          # GITHUB_ENV only takes effect for LATER steps -- cargo install runs in
          # this same step, so the strip must be a plain shell export, not that.
          export PYAPP_PROJECT_VERSION="${PYAPP_PROJECT_VERSION#v}"
          cargo install pyapp --root pyapp-out --force

      - name: Rename to the release asset name
        shell: bash
        run: |
          src="pyapp-out/bin/pyapp"
          [ -f "$src.exe" ] && src="$src.exe"
          mkdir -p out
          cp "$src" "out/${{ matrix.asset_name }}"

      - name: Sanity check (binary exists/executable; not a real --version -- that needs this tag already live on PyPI)
        shell: bash
        run: |
          chmod +x "out/${{ matrix.asset_name }}" || true
          file "out/${{ matrix.asset_name }}" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  attach:
    name: attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload release assets (create the release if binaries.yml wins the race)
      id-token: write       # OIDC identity cosign/Sigstore signs the attestation with
      attestations: write   # record the attestation against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: out
          merge-multiple: true

      # Attested HERE, in the job that uploads, and NOT in the per-OS `build` job. The
      # attestation binds a digest, so it is only worth anything if that digest is the digest
      # of the bytes a user downloads: these exact files in `out/` are what the next step
      # uploads, with nothing in between. Attesting in `build` would put the upload-artifact /
      # download-artifact round trip between the signature and the release, and would need
      # three separate calls each carrying its own token permissions on a matrix job.
      #
      # WHAT THIS DOES NOT COVER, and the release notes must not imply otherwise: the
      # attestation covers the PyApp *launcher*. The launcher fetches contextlake and its
      # the user's machine at first run -- after any signature here. Signing cannot reach that
      # half; `pip-audit-resolved` in security.yml is what watches it.
      - name: Attest build provenance for the three launchers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: out/*

      - name: Upload binaries to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            # release.yml creates the same tag's release too -- if it wins that race
            # between this check and the create call below, fall back to upload
            # rather than fail on a 422 (release already exists).
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "contextlake ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md." --verify-tag \
              || gh release upload "$GITHUB_REF_NAME" out/* --clobber
          fi
