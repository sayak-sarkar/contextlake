name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, mirroring security.yml which already had it. This is the
  # load-bearing gate -- release.yml's first job refuses to publish unless
  # ci.yml has a green conclusion for the exact tagged commit -- so having no
  # way to trigger it by hand made the whole release path unrecoverable
  # whenever a push event went missing. That is not hypothetical: during a
  # GitHub Actions incident on 2026-08-06, webhook delivery was throttled to
  # ~15% and five consecutive pushes to main triggered nothing at all. A
  # re-push cannot help (the commit is already there, so there is no new
  # event), and putting an empty commit on top would move main past the commit
  # being released, which is precisely the one that needs the run.
  workflow_dispatch:

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts benchmarks
      # Guards against the repo-root bare-script launcher (run-contextlake.py)
      # regaining the package's own name: `python -m pytest`, unlike the
      # `pytest` console script, puts the repo root first on sys.path, so a
      # file there named contextlake.py shadows the installed package and
      # every import fails before a single test collects.
      - name: Verify python -m pytest collects (no root-shim shadowing)
        run: python -m pytest --collect-only -q --ignore=tests/kb
      - name: Test core (no knowledge layer)
        run: pytest --ignore=tests/kb --cov=contextlake --cov-report=term-missing

  kb:
    name: knowledge-layer (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The [kb] extra needs Python >= 3.10 (mcp's floor).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with knowledge layer)
        run: |
          python -m pip install --upgrade pip
          # kb-dockerfile is named explicitly because `[kb]` deliberately does not carry
          # it: its grammar has no wheel for several platforms, so requiring it would
          # break installation rather than reduce it. The runner is one of the platforms
          # it DOES have a wheel for, and CI should exercise the whole supported surface.
          # The absent-grammar path is not lost by this: it is tested by injecting the
          # import failure, which runs in both configurations, because a path that is
          # only reachable on platforms CI does not run on would otherwise never be
          # covered anywhere.
          #
          # kb-vec is named for the same reason. Without it the sqlite-vec ANN backend
          # skips itself here, and `security.yml` -- the only other workflow that installs
          # the extra -- runs pip-audit and CodeQL rather than pytest. The result was a
          # backend whose tests passed on a maintainer's machine and ran in no CI job at
          # all, which is indistinguishable from having no tests for it.
          pip install -e ".[dev,kb,kb-dockerfile,kb-vec]"
      - name: Lint (ruff)
        run: ruff check src tests scripts benchmarks
      # The coverage floor lives here, on the full-suite job, and deliberately
      # nowhere else. It is not in pyproject's `addopts`, because that would
      # apply `--cov-fail-under` to *every* pytest invocation -- a narrow
      # `pytest -k something` run reports a few percent and would then "fail"
      # for a reason that has nothing to do with the code under test.
      # The core job above is likewise floor-free on purpose: it skips
      # tests/kb while still measuring the whole `contextlake` package, so its
      # honest total is ~23% and any floor meaningful here would break it.
      # Measured 92% at the time of writing; 88 leaves headroom for the small
      # per-version differences across the 3.10-3.13 matrix. Ratchet upward.
      - name: Test full suite
        run: pytest --cov=contextlake --cov-report=term-missing --cov-fail-under=88

  extras:
    # The kb cells install [dev,kb,kb-dockerfile,kb-vec]. This one installs every optional
    # extra, the configuration a maintainer's machine has. A test that only passes because an
    # extra is ABSENT, or one that reaches for a model download when it is PRESENT, fails here.
    # Joined from stability.yml on 2026-10-05 after green runs on four commits.
    name: extras (py3.12, every optional extra)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install every optional extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb-full,kb-dockerfile,kb-pdf,kb-ocr,kb-video,kb-transcribe,kb-fastembed,llm-local]"
          pip list
      - name: Test full suite (model hub offline)
        env:
          # tests/conftest.py sets this too. Setting it before Python starts as well means
          # a test that imports huggingface_hub before conftest runs still sees it.
          HF_HUB_OFFLINE: "1"
        run: pytest

  windows:
    # W02 built repo-relative paths with the OS separator, which on Windows lost every ADR and
    # nested manifest and changed symbol ids. Its tests simulate Windows paths on Linux and run
    # unpatched here; the rest of these files walk real paths on disk. Joined from
    # stability.yml on 2026-10-05; the 9.8.0 control for the init step stays there.
    name: windows (py3.12, path handling)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install with the knowledge layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb]"
      - name: Path handling (W02)
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          pytest
          tests/kb/test_windows_relative_paths.py tests/kb/test_kb_parse.py
          tests/kb/test_kb_adr.py tests/kb/test_kb_manifest.py
          tests/kb/test_kb_index_nested_dirs.py
      - name: init --local writes a kb.toml that kb reads
        # 9.8.1: init wrote the store path into TOML unescaped, and on Windows the backslashes
        # of a local path are invalid escapes, so no kb command could read the config.
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          $d = Join-Path $env:RUNNER_TEMP "init-local"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Location $d
          contextlake init --local --skip-interactive --no-mirror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path .contextlake.kb.toml -Pattern store_dir
          contextlake kb query anything --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
