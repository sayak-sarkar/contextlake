name: retrieval-quality

# RC-P2-8 / K-1: `contextlake kb eval` scores retrieval quality (precision@k /
# recall@k / MRR / hit-rate) against a golden-query set, but nothing ever ran
# it in CI -- the number was measurable, never actually measured. This job
# runs it weekly against the bundled sample-graph fixture and fails if the
# headline metric regresses below a floor, so a retrieval regression (a
# search-ranking change, an FTS tokenizer tweak, ...) shows up as a red run
# instead of silently landing.
#
# Deliberately its own workflow, not folded into ci.yml: both ci.yml and
# release.yml are under active parallel work right now, and this is additive
# reporting on a schedule, not a per-PR gate -- the same shape security.yml
# already uses for its own weekly scan.
#
# OFFLINE BY DESIGN: only `--retriever fts` (the store's own SQLite FTS5
# search) is scored here. `semantic`/`hybrid` need a configured embedder
# (Ollama reachable over the network, or an API key) that a public repo's CI
# cannot assume -- see docs/semantic-search.md. Wiring a semantic score into
# CI is future work once the project has a CI-safe embedding provider (e.g. a
# committed cache of the `kb-local` model2vec weights); until then, scoring a
# job this can't actually run offline would just be a scheduled workflow that
# fails on every run for reasons unrelated to retrieval quality.

on:
  schedule:
    # Weekly, Monday 07:00 UTC -- staggered an hour after security.yml's
    # 06:00 Monday scan so the two scheduled jobs don't queue on the same
    # runner slot.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-quality:
    name: kb eval (fts retriever, golden-query fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (with knowledge layer)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb]"

      - name: Index the evaluation fixture repo into a scratch store
        run: |
          cfg="$RUNNER_TEMP/eval-kb.toml"
          printf '[kb]\nstore_dir = "%s/eval-store"\n' "$RUNNER_TEMP" > "$cfg"
          echo "KB_EVAL_CONFIG=$cfg" >> "$GITHUB_ENV"
          # A real source tree parsed by the real parser, not a hand-written shard:
          # the score then describes what retrieval does to what the parser actually
          # produces. 42 nodes across 13 kinds, including the five symbol kinds 7.0.0
          # added, so a retrieval change that only helps functions cannot hide here.
          contextlake kb index --config "$cfg" \
            --source examples/fixtures/eval-repo --repo telemetry

      - name: Score retrieval quality (fts) against the golden-query set
        run: |
          contextlake kb eval --config "$KB_EVAL_CONFIG" \
            --golden examples/fixtures/golden-queries.json \
            --retriever fts --json > "$RUNNER_TEMP/eval-result.json"
          cat "$RUNNER_TEMP/eval-result.json"

      - name: Publish the number and gate on a floor
        run: |
          python - "$RUNNER_TEMP/eval-result.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              result = json.load(f)

          summary = (
              f"### Retrieval quality (fts, golden-query fixture)\n\n"
              f"| metric | value |\n|---|---|\n"
              f"| queries | {result['n']} |\n"
              f"| precision@{result['k']} | {result['precision@k']} |\n"
              f"| recall@{result['k']} | {result['recall@k']} |\n"
              f"| MRR | {result['mrr']} |\n"
              f"| hit-rate | {result['hit_rate']} |\n"
              f"| est. tokens/query | {result['est_tokens_per_query']} |\n"
          )
          print(summary)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary)

          # FLOOR, not a target. Measured on this fixture at the time of writing:
          # hit-rate 0.8, precision@10 0.7241, recall@10 0.8, MRR 0.8 over 30
          # queries. The 6 misses are ALL the natural-language phrasings ("reject
          # an implausible sensor value", "sample buffer"); every exact-name query
          # hits. FTS5 has no synonym or semantic matching, so those 6 are not a
          # defect here -- they are the measurable gap the semantic retriever
          # exists to close, and the reason they are in the set at all.
          #
          # The floor is READ FROM THE GOLDEN SET, not written here: a number in
          # two places drifts, and tests/kb/test_retrieval_quality.py gates on the
          # same value per PR so a regression does not wait a week for the cron.
          floor = json.load(open("examples/fixtures/golden-queries.json",
                                 encoding="utf-8"))["_floor_hit_rate"]
          hit_rate = result["hit_rate"]
          print(f"hit-rate {hit_rate} vs floor {floor}")
          if hit_rate < floor:
              print(f"::error::Retrieval quality regressed: hit-rate {hit_rate} "
                    f"is below the {floor} floor.")
              sys.exit(1)
          PY
