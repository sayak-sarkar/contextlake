name: stability

# Cells for the stability campaign's tier H (hermetic suite) and tier F (Windows paths).
#
# Manual only. ci.yml gates every release (release.yml refuses a tag without a green ci.yml
# run on the exact commit), so a new cell that turns out red would block every release until
# it is fixed. A cell starts here, and joins ci.yml's push matrix once it is green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extras:
    # ci.yml installs [dev,kb,kb-dockerfile,kb-vec]. No cell has ever run the suite with
    # kb-local, kb-pdf, the OCR/video/transcribe stack or llm-local installed, which is the
    # configuration a maintainer's machine has. A test that only passes because an extra is
    # ABSENT, or one that reaches for a model download when it is PRESENT, shows up here.
    name: extras (py3.12, every optional extra)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install every optional extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb-full,kb-dockerfile,kb-pdf,kb-ocr,kb-video,kb-transcribe,kb-fastembed,llm-local]"
          pip list
      - name: Test full suite (model hub offline)
        env:
          # tests/conftest.py sets this too. Setting it before Python starts as well means
          # a test that imports huggingface_hub before conftest runs still sees it.
          HF_HUB_OFFLINE: "1"
        run: pytest

  windows:
    # Tier F: W02 built repo-relative paths with the OS separator, which on Windows lost every
    # ADR and nested manifest and changed symbol ids. Its tests simulate Windows paths on
    # Linux and run unpatched here. The rest of these files walk real paths on disk.
    name: windows (py3.12, path handling)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install with the knowledge layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,kb]"
      - name: Path handling (W02)
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          pytest
          tests/kb/test_windows_relative_paths.py tests/kb/test_kb_parse.py
          tests/kb/test_kb_adr.py tests/kb/test_kb_manifest.py
          tests/kb/test_kb_index_nested_dirs.py
